<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" font-family="IPAGothic, sans-serif">
  <rect width="1120" height="440" fill="#FFFFFF"/>
  <text x="20" y="34" font-size="24" font-weight="bold" fill="#1F2933">Windows のプロキシ設定は 2 つある</text>
  <text x="20" y="60" font-size="16" fill="#4A5560">片方だけ直すと「ブラウザは見えるのに更新だけ出られない」になる</text>

  <!-- PC -->
  <rect x="20" y="88" width="470" height="300" rx="10" fill="#F3F5F7" stroke="#9AA6B2" stroke-width="2"/>
  <text x="40" y="118" font-size="18" font-weight="bold" fill="#1F2933">この PC</text>

  <!-- WinINET 側 -->
  <rect x="40" y="136" width="430" height="106" rx="8" fill="#EAF3FB" stroke="#5AA0D8" stroke-width="2"/>
  <text x="56" y="162" font-size="17" font-weight="bold" fill="#1F2933">WinINET（ユーザーごと）</text>
  <text x="56" y="186" font-size="15" fill="#4A5560">ブラウザ・ユーザーが動かすアプリ</text>
  <text x="56" y="212" font-size="14" fill="#2F5A7A">設定の置き場: レジストリ（HKCU）／ 権限は不要</text>
  <text x="56" y="232" font-size="14" fill="#2F5A7A">直接・PAC・固定サーバ から選べる</text>

  <!-- WinHTTP 側 -->
  <rect x="40" y="256" width="430" height="112" rx="8" fill="#FFF4E6" stroke="#E39B3C" stroke-width="2"/>
  <text x="56" y="282" font-size="17" font-weight="bold" fill="#1F2933">WinHTTP（PC 全体で 1 つ）</text>
  <text x="56" y="306" font-size="15" fill="#4A5560">Windows Update・監視エージェント・サービス</text>
  <text x="56" y="332" font-size="14" fill="#7A5A28">設定の置き場: システム／ 書き込みは昇格が要る</text>
  <text x="56" y="352" font-size="14" fill="#7A5A28">直接・固定サーバ のみ（PAC は扱えない）</text>

  <!-- プロキシ -->
  <rect x="640" y="150" width="200" height="90" rx="10" fill="#EAFBF2" stroke="#3FA97B" stroke-width="2"/>
  <text x="740" y="188" font-size="18" font-weight="bold" fill="#1F2933" text-anchor="middle">プロキシ</text>
  <text x="740" y="214" font-size="14" fill="#2F6B52" text-anchor="middle">PAC / 固定</text>

  <rect x="900" y="150" width="200" height="90" rx="10" fill="#EAF3FB" stroke="#5AA0D8" stroke-width="2"/>
  <text x="1000" y="188" font-size="18" font-weight="bold" fill="#1F2933" text-anchor="middle">インターネット</text>

  <!-- 線 -->
  <g stroke="#5AA0D8" stroke-width="3" fill="none">
    <path d="M470 189 H 600 V 195 H 636"/>
  </g>
  <g stroke="#E39B3C" stroke-width="3" fill="none">
    <path d="M470 312 H 600 V 210 H 636"/>
  </g>
  <g stroke="#3FA97B" stroke-width="3" fill="none">
    <path d="M840 195 H 896"/>
  </g>
  <g fill="#3FA97B">
    <polygon points="896,189 908,195 896,201"/>
  </g>

  <text x="500" y="182" font-size="14" fill="#2F5A7A">ブラウザの通信</text>
  <text x="500" y="332" font-size="14" fill="#7A5A28">更新・エージェントの通信</text>

  <!-- 注意 -->
  <rect x="20" y="400" width="1080" height="30" rx="6" fill="#FDF0F2" stroke="#E4899A"/>
  <text x="40" y="421" font-size="16" fill="#1F2933">よくある詰まり: 下段（WinHTTP）が空のまま → Windows Update・監視だけが外に出られない</text>
</svg>
