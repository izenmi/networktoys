<!--
    PingWatcher のアイコン。見張るふくろう+ロキシー(無職転生)風の魔導士帽。

    ・瞳を同心円にして、ping の波紋を兼ねている（色は本体の配色に合わせる）
    ・帽子はつば広+先の折れたとんがり帽。鍔と山は茶系 2 色、帯はアプリの
      アクセントと同じ水色（ロキシーの髪色）
    ・耳は帽子の下に隠れるので描かない。輪郭の個性は帽子が引き受ける
    ・タイル（背景の角丸四角）は敷かない。地は透過のまま

    帽子のぶん頭上に余白が要るので、中心まわりの transform は
    以前(1.19 倍)より控えめにしてある。

    .ico はこの SVG から tools/icon/build_icon.sh で焼く。手で描き直さないこと。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g transform="translate(12,11.8) scale(1.08) translate(-12,-11.8)">
    <!-- 体 -->
    <rect x="3.4" y="6.5" width="17.2" height="14.3" rx="8.6" fill="#A9E6A3"/>

    <!-- 帽子: つば -->
    <ellipse cx="12" cy="7.0" rx="9.4" ry="1.85" fill="#6E4A2E"/>

    <!-- 帽子: 山。背を高く、先を右へ折る(とんがり帽の輪郭を保つこと) -->
    <path d="M7.0 7.0
             C7.4 5.4 8.2 3.4 9.8 2.2
             C10.8 1.5 11.8 1.3 12.6 1.35
             C13.4 0.95 15.6 0.7 17.6 1.05
             C16.4 1.6 15.3 1.9 15.0 2.7
             C15.6 4.1 16.4 5.6 16.8 7.0
             Z" fill="#8A5D3B"/>

    <!-- 帽子: 帯(アクセントの水色) -->
    <path d="M6.35 7.0 L17.7 7.0 L17.35 5.7
             C14.6 5.05 9.4 5.05 6.7 5.7 Z" fill="#5AA0D8"/>

    <!-- 目。外側の暗い円は、地が明るくても暗くても目として読めるように置いている -->
    <circle cx="8.5" cy="12.2" r="3.35" fill="#1E2320"/>
    <circle cx="15.5" cy="12.2" r="3.35" fill="#1E2320"/>

    <!-- 瞳＝波紋 -->
    <circle cx="8.5" cy="12.2" r="2.25" fill="none" stroke="#7FDCC2" stroke-width="0.9"/>
    <circle cx="15.5" cy="12.2" r="2.25" fill="none" stroke="#7FDCC2" stroke-width="0.9"/>
    <circle cx="8.5" cy="12.2" r="0.95" fill="#7FDCC2"/>
    <circle cx="15.5" cy="12.2" r="0.95" fill="#7FDCC2"/>

    <!-- くちばし。緑と青に偏らないよう 1 点だけ黄を置く -->
    <path d="M12 14.9l1.5 2.3h-3z" fill="#FFC65C"/>
  </g>
</svg>
