<!--
    PingWatcher のアイコン・小サイズ版（16 / 20 / 24 px 用）。

    通常版をそのまま縮めると、瞳の細い輪が潰れて全体がぼやける。
    小さいところでは輪を捨て、代わりに

    ・目を大きく、瞳を太く
    ・耳を大きく角張らせて、輪郭でふくろうと分かるように
    ・くちばしも一回り大きく

    としてある。同じ絵に見せることより、<b>その大きさで何か分かること</b>を優先する。
    アイコンを 1 枚の絵で全サイズ賄わないのは、Windows の標準アイコンでも同じ作り。

    .ico はこの SVG と AppIcon.svg の両方から tools/icon/build_icon.sh で焼く。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 耳。通常版より大きく、角を立てる -->
  <path d="M2.2 1.4l7.4 3.9-7.8 3.2z" fill="#9BE84F"/>
  <path d="M21.8 1.4l-7.4 3.9 7.8 3.2z" fill="#9BE84F"/>

  <!-- 体 -->
  <rect x="1.4" y="4.2" width="21.2" height="18.4" rx="10.6" fill="#9BE84F"/>

  <!-- 目。輪は置かず、太い瞳だけにする -->
  <circle cx="7.5" cy="11.6" r="4.1" fill="#1B2A16"/>
  <circle cx="16.5" cy="11.6" r="4.1" fill="#1B2A16"/>
  <circle cx="7.5" cy="11.6" r="1.95" fill="#74C9FF"/>
  <circle cx="16.5" cy="11.6" r="1.95" fill="#74C9FF"/>

  <!-- くちばし -->
  <path d="M12 15.4l2.1 3.2h-4.2z" fill="#FFC65C"/>
</svg>
