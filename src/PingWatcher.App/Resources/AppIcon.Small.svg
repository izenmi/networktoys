<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 16/20/24px 用。通常版をそのまま縮めると接点 8 本が 1px 未満になって
       全体が濁るので、その大きさ用に描き直してある。
       同じ絵に見せることより、その大きさで何か分かることを優先する。
       接点を 4 本に減らして太くし、そのぶん余白を削って外形を大きく取った。
       ツメと接点の割合は通常版に合わせてあるので、並んでも同じ絵に見える。 -->

  <!-- ツメ -->
  <path d="M7.85 7.8 L8.9 1.2 L15.1 1.2 L16.15 7.8 Z" fill="#7FC1EE" />

  <!-- 本体 -->
  <rect x="1.6" y="7.0" width="20.8" height="15.0" rx="1.4" fill="#5AA0D8" />

  <!-- 接点 4 本。幅 2.2・ピッチ 3.6、末端 18.5 で中心が本体と同じ 12 に揃う -->
  <g fill="#EAF6FF">
    <rect x="5.5" y="9.0" width="2.2" height="6.6" />
    <rect x="9.1" y="9.0" width="2.2" height="6.6" />
    <rect x="12.7" y="9.0" width="2.2" height="6.6" />
    <rect x="16.3" y="9.0" width="2.2" height="6.6" />
  </g>
</svg>
