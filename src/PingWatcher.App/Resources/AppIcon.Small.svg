<!--
    PingWatcher のアイコン・小サイズ版（16 / 20 / 24 px 用）。

    通常版をそのまま縮めると、瞳の細い輪と帽子の細部が潰れてぼやける。
    小さいところでは

    ・瞳は輪を捨てて太い 1 点に
    ・帽子は太い三角の山+厚い鍔+太い帯だけに単純化
    ・くちばしも一回り大きく

    としてある。同じ絵に見せることより、その大きさで何か分かることを優先する。
    アイコンを 1 枚の絵で全サイズ賄わないのは、Windows の標準アイコンでも同じ作り。

    .ico はこの SVG と AppIcon.svg の両方から tools/icon/build_icon.sh で焼く。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 体 -->
  <rect x="1.8" y="8.0" width="20.4" height="15.6" rx="10.2" fill="#A9E6A3"/>

  <!-- 帽子: つば(厚め) -->
  <ellipse cx="12" cy="8.2" rx="10.6" ry="2.1" fill="#6E4A2E"/>

  <!-- 帽子: 山。背を高く、先を右へ折るのは通常版と同じ意匠 -->
  <path d="M6.2 8.2
           C6.8 5.2 8.4 2.6 10.6 1.8
           C11.6 1.4 12.6 1.4 13.2 1.5
           C14.4 0.7 16.9 0.6 18.8 1.2
           C17.4 2.0 16.2 2.3 15.9 3.2
           C16.6 4.8 17.4 6.6 17.9 8.2
           Z" fill="#8A5D3B"/>

  <!-- 帽子: 帯 -->
  <path d="M5.7 8.2 L18.35 8.2 L17.9 6.2
           C14.4 5.5 9.4 5.5 6.3 6.2 Z" fill="#5AA0D8"/>

  <!-- 目。輪は置かず、太い瞳だけにする -->
  <circle cx="7.6" cy="14.4" r="3.9" fill="#1E2320"/>
  <circle cx="16.4" cy="14.4" r="3.9" fill="#1E2320"/>
  <circle cx="7.6" cy="14.4" r="1.9" fill="#7FDCC2"/>
  <circle cx="16.4" cy="14.4" r="1.9" fill="#7FDCC2"/>

  <!-- くちばし -->
  <path d="M12 18.0l2.1 3.1h-4.2z" fill="#FFC65C"/>
</svg>
