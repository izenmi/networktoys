<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 16/20/24px 用。通常版をそのまま縮めると積み木 3 つが 1px 台になって
       箱の上が濁るので、その大きさ用に描き直してある。
       同じ絵に見せることより、その大きさで何か分かることを優先する。
       積み木を 2 つに減らして大きくし、箱の縁を厚くした。
       色と配置は通常版に合わせてあるので、並んでも同じ絵に見える。 -->

  <!-- 積み木 2 つ。丸は小さくすると角丸の四角と見分けが付かないので、
       この大きさでは四角と三角だけにする -->
  <rect x="2.6" y="2.6" width="7.2" height="6.4" rx="0.9" fill="#68EEC2" />
  <path d="M16.6 2.2 L21.4 9.0 L11.8 9.0 Z" fill="#FFC65C" />

  <!-- 箱の口(縁)。小さいほど段差が消えるので厚めに取る -->
  <rect x="0.8" y="8.6" width="22.4" height="4.0" rx="1.1" fill="#7FC1EE" />

  <!-- 箱の本体 -->
  <rect x="2.2" y="12.2" width="19.6" height="9.6" rx="1.5" fill="#5AA0D8" />
</svg>
