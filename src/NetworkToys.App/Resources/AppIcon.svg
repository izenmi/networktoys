<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- LAN ケーブルの端子(RJ45)を正面から見た形。32px 以上はこれを焼く。
       地は敷かない(透過)。tools/icon/build_icon.sh が使う ImageMagick の
       内蔵 SVG レンダラはグラデーションを解釈せず黒く潰すので、べた塗りだけで描く。 -->

  <!-- ツメ。本体より明るくして段差を出す。
       本体幅の 4 割・本体高さの 4 割強まで伸ばさないと弁当箱の取っ手に見える。
       上を 3 割まで細めた台形にするのも同じ理由 -->
  <path d="M8.0 7.6 L9.0 1.2 L15.0 1.2 L16.0 7.6 Z" fill="#7FC1EE" />

  <!-- 本体 -->
  <rect x="2.0" y="6.8" width="20.0" height="14.4" rx="1.3" fill="#5AA0D8" />

  <!-- 接点 8 本。ピッチ 2.1、末端 19.9 で中心が本体と同じ 12 に揃う。
       短いと本体の下半分が空いて間が抜ける -->
  <g fill="#EAF6FF">
    <rect x="4.1" y="8.8" width="1.3" height="6.4" />
    <rect x="6.2" y="8.8" width="1.3" height="6.4" />
    <rect x="8.3" y="8.8" width="1.3" height="6.4" />
    <rect x="10.4" y="8.8" width="1.3" height="6.4" />
    <rect x="12.5" y="8.8" width="1.3" height="6.4" />
    <rect x="14.6" y="8.8" width="1.3" height="6.4" />
    <rect x="16.7" y="8.8" width="1.3" height="6.4" />
    <rect x="18.8" y="8.8" width="1.3" height="6.4" />
  </g>
</svg>
