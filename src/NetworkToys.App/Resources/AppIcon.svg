<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- おもちゃ箱。箱の口から積み木が覗く形。32px 以上はこれを焼く。
       地は敷かない(透過)。tools/icon/build_icon.sh が使う ImageMagick の
       内蔵 SVG レンダラはグラデーションを解釈せず黒く潰すので、べた塗りだけで描く。 -->

  <!-- 積み木。箱の縁より上に出た分だけが見える。
       ■▲● の 3 つを使うのは、色に頼らず形だけでも 3 つあると分かるようにするため -->
  <rect x="3.6" y="3.4" width="5.2" height="5.2" rx="0.8" fill="#68EEC2" />
  <path d="M12.0 2.6 L15.2 8.6 L8.8 8.6 Z" fill="#FFC65C" />
  <circle cx="18.2" cy="5.8" r="2.8" fill="#FF8B9E" />

  <!-- 箱の口(縁)。本体より明るくして段差を出す。
       ここが無いと積み木が箱の「上に載っている」ように見える -->
  <rect x="1.2" y="8.4" width="21.6" height="3.4" rx="1.0" fill="#7FC1EE" />

  <!-- 箱の本体。縁より少し細くして、口が張り出しているように見せる -->
  <rect x="2.6" y="11.4" width="18.8" height="10.4" rx="1.4" fill="#5AA0D8" />
</svg>
