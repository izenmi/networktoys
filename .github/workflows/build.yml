name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ネットワークにも UI にも触らない純粋ロジックのテスト。
  # 開発環境が Linux で exe を動かせないため、ここが第一の防波堤になる。
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: テスト
        run: dotnet test tests/PastelNet.Core.Tests/PastelNet.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  # Phase 0 限定のマトリクス。
  # WPF は PublishSingleFile と PublishReadyToRun を併用すると起動に失敗する報告があり
  # (dotnet/wpf#7282, #11436)、実機がないと判断できない。また WPF はトリミングできないため
  # self-contained のサイズが大きい。圧縮すると縮むが R2R の起動高速化と打ち消し合う。
  # 起動時間・メモリ・サイズを一度に実測して採用形を決める。確定したら単一構成に畳む。
  publish:
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: single-r2r
            label: 単一exe + R2R
            args: '--self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true'
          - name: single-r2r-compressed
            label: 単一exe + R2R + 圧縮
            args: '--self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:EnableCompressionInSingleFile=true'
          - name: r2r-only
            label: R2R のみ（フォルダ配布）
            args: '--self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=true'
          - name: single-only
            label: 単一exe のみ（R2R なし）
            args: '--self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false'
          - name: framework-dependent
            label: ランタイム別途（軽量版）
            args: '--self-contained false -p:PublishSingleFile=true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: publish (${{ matrix.name }})
        shell: pwsh
        run: |
          dotnet publish src/PastelNet.App/PastelNet.App.csproj `
            -c Release `
            -r win-x64 `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            ${{ matrix.args }} `
            -o publish/${{ matrix.name }}
          if ($LASTEXITCODE -ne 0) { throw "publish が失敗しました" }

      - name: 自己診断 (--selftest)
        shell: pwsh
        working-directory: publish/${{ matrix.name }}
        run: |
          $exe = Join-Path $PWD 'PastelNet.exe'
          if (-not (Test-Path $exe)) { throw "PastelNet.exe が生成されていません" }

          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -WorkingDirectory $PWD
          if (Test-Path 'selftest.log') { Get-Content 'selftest.log' | Write-Host }
          if ($p.ExitCode -ne 0) { throw "自己診断が失敗しました (exit $($p.ExitCode))" }

      - name: GUI 起動スモークテスト
        shell: pwsh
        working-directory: publish/${{ matrix.name }}
        run: |
          $exe = Join-Path $PWD 'PastelNet.exe'

          # 単一ファイル版の初回起動はネイティブライブラリを %TEMP%\.net へ展開するため
          # 遅くなる。1 回目(初回展開込み)と 2 回目(キャッシュ後)の両方を測る。
          function Measure-Launch {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $proc = Start-Process -FilePath $exe -PassThru -WorkingDirectory $PWD
            $ok = $proc.WaitForInputIdle(60000)
            $sw.Stop()
            Start-Sleep -Seconds 2
            $proc.Refresh()
            if ($proc.HasExited) { throw "起動直後に終了しました (exit $($proc.ExitCode))" }
            $mem = [math]::Round($proc.WorkingSet64 / 1MB, 1)
            Stop-Process -Id $proc.Id -Force
            Start-Sleep -Seconds 2
            return [pscustomobject]@{ Ms = $sw.ElapsedMilliseconds; Mem = $mem; Ready = $ok }
          }

          $first  = Measure-Launch
          $second = Measure-Launch

          $sizeMb = [math]::Round(((Get-ChildItem -Recurse -File $PWD | Measure-Object -Property Length -Sum).Sum) / 1MB, 1)
          $exeMb  = [math]::Round((Get-Item $exe).Length / 1MB, 1)

          Write-Host "初回起動: $($first.Ms) ms / 2回目: $($second.Ms) ms / メモリ: $($second.Mem) MB / exe: ${exeMb} MB / 一式: ${sizeMb} MB"

          # ランナーは実機より遅いので絶対値は参考値。構成間の相対比較に使う。
          # マトリクスのジョブごとにサマリが分かれるため、各ジョブで表ごと出力する
          $state = if ($first.Ready -and $second.Ready) { 'OK' } else { '要確認' }
          @(
            "### ${{ matrix.label }}"
            ""
            "| 起動確認 | 初回起動 | 2回目 | メモリ | exe | 一式 |"
            "|---|---|---|---|---|---|"
            "| $state | $($first.Ms) ms | $($second.Ms) ms | $($second.Mem) MB | ${exeMb} MB | ${sizeMb} MB |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        with:
          name: PastelNet-${{ matrix.name }}
          path: publish/${{ matrix.name }}
          retention-days: 14
