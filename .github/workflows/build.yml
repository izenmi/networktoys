name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ネットワークにも UI にも触らない純粋ロジックのテスト。
  # 開発環境が Linux で exe を動かせないため、ここが第一の防波堤になる。
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: テスト
        run: dotnet test tests/NetworkToys.Core.Tests/NetworkToys.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  # Phase 0 の実測（CI ランナー上）で決めた 2 構成。
  #   単一exe + R2R      : 起動 663ms / メモリ 93.5MB / 124.8MB
  #   ランタイム別途     : 起動 683ms / メモリ 91.2MB / 0.2MB
  # 圧縮版(-p:EnableCompressionInSingleFile)はサイズが 58.6MB まで縮む代わりに
  # メモリ 182.7MB・初回起動 5 秒になるため不採用。
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            label: 単一exe（.NET 同梱）
            args: '--self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true'
          - name: win-x64-runtime-required
            label: 軽量版（.NET ランタイムが別途必要）
            args: '--self-contained false -p:PublishSingleFile=true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: publish (${{ matrix.name }})
        shell: pwsh
        run: |
          dotnet publish src/NetworkToys.App/NetworkToys.App.csproj `
            -c Release `
            -r win-x64 `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            ${{ matrix.args }} `
            -o publish/${{ matrix.name }}
          if ($LASTEXITCODE -ne 0) { throw "publish が失敗しました" }

      # 軽量版は .NET デスクトップランタイムが別途要る。入っていないと exe は
      # 同梱物の著作権表示。exe にも埋め込んである（ヘルプ → ライセンス情報）が、
      # 配布物としてテキストでも添える。MIT / Apache-2.0 / OFL 1.1 はいずれも
      # 再配布時にライセンス本文を添えることを求めている。
      - name: ライセンス表示を同梱
        shell: pwsh
        run: |
          Copy-Item THIRD-PARTY-NOTICES.txt publish/${{ matrix.name }}/THIRD-PARTY-NOTICES.txt
          Copy-Item LICENSE publish/${{ matrix.name }}/LICENSE.txt

      # 同梱は csproj（Content）で行う。ここは入っていることの確認だけ
      - name: 使い方が同梱されていることを確認
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/${{ matrix.name }}/使い方.md")) { throw "使い方.md が同梱されていません" }

      # Windows 側の起動処理で止まり、アプリのコードは 1 行も動かないので、
      # 「入っていないときの案内」はアプリの中には書けない。exe の隣に置く
      # このスクリプトが、起動前に確かめて日本語で案内する。
      - name: 起動用スクリプトを同梱（軽量版のみ）
        if: matrix.name == 'win-x64-runtime-required'
        shell: pwsh
        run: |
          Copy-Item tools/launcher/NetworkToys.cmd publish/${{ matrix.name }}/NetworkToys.cmd

          # ランナーにはランタイムが入っているので、見つけられることを確かめる。
          # --check は判定だけしてアプリを起動しない口。
          # (入っていない側の分岐は CI では踏めない)
          $launcher = (Resolve-Path "publish/${{ matrix.name }}/NetworkToys.cmd").Path
          $out = & $launcher --check 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "起動用スクリプトがランタイムを見つけられなかった (終了コード $LASTEXITCODE): $out"
          }

      # ウィンドウを実際に開いてレイアウトまで通す検査。XAML の誤りやフォント初期化の
      # 不具合はコンパイルを通り抜けるので、ここが実質唯一の防波堤になる。
      - name: 自己診断 (--selftest)
        shell: pwsh
        working-directory: publish/${{ matrix.name }}
        run: |
          $exe = Join-Path $PWD 'NetworkToys.exe'
          if (-not (Test-Path $exe)) { throw "NetworkToys.exe が生成されていません" }

          function Invoke-SelfTest {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -WorkingDirectory $PWD
            $sw.Stop()
            return [pscustomobject]@{ Ms = $sw.ElapsedMilliseconds; Code = $proc.ExitCode }
          }

          # 単一ファイル版の初回起動はネイティブライブラリを %TEMP%\.net へ展開するため遅い
          $first  = Invoke-SelfTest

          # 1 回目のログは 2 回目で上書きされるので、先に出しておく。
          # 「初回起動だけ落ちる」(dotnet/wpf#7282 の症状)はここでしか捕まえられない
          if (Test-Path 'selftest.log') { Write-Host '--- 1回目 ---'; Get-Content 'selftest.log' | Write-Host }
          if (Test-Path 'crash.log')    { Get-Content 'crash.log'    | Write-Host }

          $second = Invoke-SelfTest

          if (Test-Path 'selftest.log') { Write-Host '--- 2回目 ---'; Get-Content 'selftest.log' | Write-Host }
          if (Test-Path 'crash.log')    { Get-Content 'crash.log'    | Write-Host }

          if ($first.Code -ne 0)  { throw "自己診断が初回の実行で失敗しました (exit $($first.Code))" }
          if ($second.Code -ne 0) { throw "自己診断が失敗しました (exit $($second.Code))" }

          "SELFTEST_FIRST=$($first.Ms)"  | Add-Content -Path $env:GITHUB_ENV
          "SELFTEST_SECOND=$($second.Ms)" | Add-Content -Path $env:GITHUB_ENV

      - name: GUI 起動スモークテスト
        shell: pwsh
        working-directory: publish/${{ matrix.name }}
        run: |
          $exe = Join-Path $PWD 'NetworkToys.exe'
          Remove-Item 'crash.log' -ErrorAction SilentlyContinue

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath $exe -PassThru -WorkingDirectory $PWD
          $ready = $proc.WaitForInputIdle(60000)
          $sw.Stop()

          if (-not $ready) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "60 秒以内にメッセージループへ入りませんでした（ハングの疑い）"
          }

          Start-Sleep -Seconds 3
          $proc.Refresh()

          if ($proc.HasExited) {
            Write-Host "起動直後に終了しました (exit $($proc.ExitCode))"
            if (Test-Path 'crash.log') { Get-Content 'crash.log' | Write-Host }
            throw "GUI を表示できませんでした"
          }

          $mem = [math]::Round($proc.WorkingSet64 / 1MB, 1)
          Stop-Process -Id $proc.Id -Force

          # プロセス終了とファイルハンドル解放は非同期。待たずに後片付けへ進むと
          # ログの削除が空振りして selftest.log が成果物に混入することがある
          $proc.WaitForExit(5000) | Out-Null

          $sizeMb = [math]::Round(((Get-ChildItem -Recurse -File $PWD | Measure-Object -Property Length -Sum).Sum) / 1MB, 1)

          # ランナーは実機より遅いので絶対値は参考値。構成間の相対比較に使う
          @(
            "### ${{ matrix.label }}"
            ""
            "| GUI 起動 | メモリ | 配布サイズ | 自己診断 初回 | 2回目 |"
            "|---|---|---|---|---|"
            "| $($sw.ElapsedMilliseconds) ms | ${mem} MB | ${sizeMb} MB | $env:SELFTEST_FIRST ms | $env:SELFTEST_SECOND ms |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      # 検査で出た副産物は配布物に混ぜない
      - name: 後片付け
        shell: pwsh
        run: Remove-Item 'publish/${{ matrix.name }}/selftest.log', 'publish/${{ matrix.name }}/crash.log', 'publish/${{ matrix.name }}/settings.json', 'publish/${{ matrix.name }}/theme.txt' -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: NetworkToys-${{ matrix.name }}
          path: publish/${{ matrix.name }}
          retention-days: 30

  # v* タグを push したときだけ Release を作る
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: zip にまとめて SHA256 を出す
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -q9r "../../release/${name}-${GITHUB_REF_NAME}.zip" .)
          done
          cd release && sha256sum *.zip | tee SHA256SUMS.txt

      - name: Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --repo "$GITHUB_REPOSITORY"
