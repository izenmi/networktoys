name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ネットワークにも UI にも触らない純粋ロジックのテスト。
  # 開発環境が Linux で exe を動かせないため、ここが第一の防波堤になる。
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: テスト
        run: dotnet test tests/PastelNet.Core.Tests/PastelNet.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  # Phase 0 限定のマトリクス。
  # WPF は PublishSingleFile と PublishReadyToRun を併用すると起動に失敗する報告があり
  # (dotnet/wpf#7282, #11436)、実機がないと判断できない。また WPF はトリミングできないため
  # self-contained のサイズが大きい。圧縮すると縮むが R2R の起動高速化と打ち消し合う。
  # 所要時間とサイズを実測して採用形を決める。確定したら単一構成に畳む。
  publish:
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: single-r2r
            label: 単一exe + R2R
            args: '--self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true'
          - name: single-r2r-compressed
            label: 単一exe + R2R + 圧縮
            args: '--self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:EnableCompressionInSingleFile=true'
          - name: r2r-only
            label: R2R のみ（フォルダ配布）
            args: '--self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=true'
          - name: single-only
            label: 単一exe のみ（R2R なし）
            args: '--self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false'
          - name: framework-dependent
            label: ランタイム別途（軽量版）
            args: '--self-contained false -p:PublishSingleFile=true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: publish (${{ matrix.name }})
        shell: pwsh
        run: |
          dotnet publish src/PastelNet.App/PastelNet.App.csproj `
            -c Release `
            -r win-x64 `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            ${{ matrix.args }} `
            -o publish/${{ matrix.name }}
          if ($LASTEXITCODE -ne 0) { throw "publish が失敗しました" }

      # 自己診断はウィンドウを出さないので、対話デスクトップの有無に関係なく必ず動く。
      # これが Phase 0 の合否判定であり、構成間の比較指標でもある。
      - name: 自己診断 (--selftest)
        shell: pwsh
        working-directory: publish/${{ matrix.name }}
        run: |
          $exe = Join-Path $PWD 'PastelNet.exe'
          if (-not (Test-Path $exe)) { throw "PastelNet.exe が生成されていません" }

          function Invoke-SelfTest {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -WorkingDirectory $PWD
            $sw.Stop()
            return [pscustomobject]@{ Ms = $sw.ElapsedMilliseconds; Code = $proc.ExitCode }
          }

          # 単一ファイル版の初回起動はネイティブライブラリを %TEMP%\.net へ展開するため
          # 遅い。1 回目（初回展開込み）と 2 回目（キャッシュ後）の両方を測る。
          $first  = Invoke-SelfTest
          $second = Invoke-SelfTest

          if (Test-Path 'selftest.log') { Get-Content 'selftest.log' | Write-Host }
          if (Test-Path 'crash.log')    { Get-Content 'crash.log'    | Write-Host }

          $sizeMb = [math]::Round(((Get-ChildItem -Recurse -File $PWD | Measure-Object -Property Length -Sum).Sum) / 1MB, 1)
          $exeMb  = [math]::Round((Get-Item $exe).Length / 1MB, 1)

          Write-Host "初回: $($first.Ms) ms / 2回目: $($second.Ms) ms / exe: ${exeMb} MB / 一式: ${sizeMb} MB"

          # ランナーは実機より遅いので絶対値は参考値。構成間の相対比較に使う。
          # マトリクスのジョブごとにサマリが分かれるため、各ジョブで表ごと出力する
          @(
            "### ${{ matrix.label }}"
            ""
            "| 自己診断 初回 | 2回目 | exe | 一式 |"
            "|---|---|---|---|"
            "| $($first.Ms) ms | $($second.Ms) ms | ${exeMb} MB | ${sizeMb} MB |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          if ($second.Code -ne 0) { throw "自己診断が失敗しました (exit $($second.Code))" }

      # ウィンドウを実際に表示できるかは、ランナーに対話デスクトップがあるかに依存する。
      # 落ちても構成の可否は判断できるので、ここは情報収集にとどめて先へ進める。
      - name: GUI 起動スモークテスト（参考・失敗しても続行）
        id: gui
        continue-on-error: true
        shell: pwsh
        working-directory: publish/${{ matrix.name }}
        run: |
          $exe = Join-Path $PWD 'PastelNet.exe'
          Remove-Item 'crash.log' -ErrorAction SilentlyContinue

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath $exe -PassThru -WorkingDirectory $PWD
          $ready = $proc.WaitForInputIdle(60000)
          $sw.Stop()

          Start-Sleep -Seconds 3
          $proc.Refresh()

          if ($proc.HasExited) {
            Write-Host "起動直後に終了しました (exit $($proc.ExitCode))"
            if (Test-Path 'crash.log') { Get-Content 'crash.log' | Write-Host }
            throw "GUI を表示できませんでした"
          }

          $mem = [math]::Round($proc.WorkingSet64 / 1MB, 1)
          Stop-Process -Id $proc.Id -Force
          Write-Host "GUI 起動: $($sw.ElapsedMilliseconds) ms / メモリ: ${mem} MB / InputIdle: $ready"

          @("", "GUI 起動: $($sw.ElapsedMilliseconds) ms ・ メモリ ${mem} MB") |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: PastelNet-${{ matrix.name }}
          path: publish/${{ matrix.name }}
          retention-days: 14
